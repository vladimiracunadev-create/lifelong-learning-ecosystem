<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tres sistemas de aprendizaje en educación y evaluación</title>
  <desc id="desc">Diferencia el currículo escolar, la formación pedagógica y el estudio de instrumentos de evaluación.</desc>
  <defs><style>
    .bg{fill:#f5f9ff}.card{fill:#fff;stroke:#cbdbea;stroke-width:2}.title{font:800 34px system-ui,sans-serif;fill:#203e5d}.lead{font:500 17px system-ui,sans-serif;fill:#5b7085}.who{font:800 13px system-ui,sans-serif;letter-spacing:1.5px;fill:#3d6c94}.repo{font:800 18px system-ui,sans-serif;fill:#244967}.meta{font:500 15px system-ui,sans-serif;fill:#64798b}.flow{fill:#e7f1fa}.flowtext{font:700 14px system-ui,sans-serif;fill:#315d81;text-anchor:middle}.status{font:700 12px system-ui,sans-serif;text-anchor:middle}.ok{fill:#dff3e8}.oktext{fill:#236344}.dev{fill:#fff0c7}.devtext{fill:#765500}.rule{font:700 17px system-ui,sans-serif;fill:#fff;text-anchor:middle}
  </style></defs>
  <rect class="bg" width="1200" height="560" rx="30"/>
  <text class="title" x="60" y="70">Tres públicos; tres recorridos que no deben confundirse</text>
  <text class="lead" x="60" y="106">La pregunta inicial es quién aprende y para qué usará la evidencia.</text>
  <g transform="translate(55 155)"><rect class="card" width="350" height="280" rx="22"/><text class="who" x="25" y="43">ESTUDIANTE · DOCENTE</text><text class="repo" x="25" y="82">Trayectoria escolar chilena</text><text class="meta" x="25" y="112">12 niveles · OA · secuencias</text><rect class="flow" x="25" y="145" width="300" height="69" rx="15"/><text class="flowtext" x="175" y="173">nivel → asignatura/OA</text><text class="flowtext" x="175" y="196">→ experiencia → evidencia</text><rect class="ok" x="25" y="235" width="88" height="25" rx="12"/><text class="status oktext" x="69" y="252">EXISTENTE</text></g>
  <g transform="translate(425 155)"><rect class="card" width="350" height="280" rx="22"/><text class="who" x="25" y="43">DOCENTE · FORMADOR</text><text class="repo" x="25" y="82">Pedagogía y aprendizaje</text><text class="meta" x="25" y="112">300 clases · 14 rutas por rol</text><rect class="flow" x="25" y="145" width="300" height="69" rx="15"/><text class="flowtext" x="175" y="173">secuencia completa</text><text class="flowtext" x="175" y="196">o ruta por rol/objetivo</text><rect class="ok" x="25" y="235" width="88" height="25" rx="12"/><text class="status oktext" x="69" y="252">EXISTENTE</text></g>
  <g transform="translate(795 155)"><rect class="card" width="350" height="280" rx="22"/><text class="who" x="25" y="43">EVALUADOR · DISEÑADOR</text><text class="repo" x="25" y="82">Psicometría y evaluación</text><text class="meta" x="25" y="112">5 de 40 clases · 5 laboratorios</text><rect class="flow" x="25" y="145" width="300" height="69" rx="15"/><text class="flowtext" x="175" y="173">puntuación → escalas</text><text class="flowtext" x="175" y="196">→ evidencia → límites</text><rect class="dev" x="25" y="235" width="122" height="25" rx="12"/><text class="status devtext" x="86" y="252">EN DESARROLLO</text></g>
  <rect x="130" y="475" width="940" height="48" rx="18" fill="#244967"/><text class="rule" x="600" y="505">Un programa para formadores no se presenta automáticamente como currículo infantil.</text>
</svg>
