<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de arte, espacio y oficios</title>
  <desc id="desc">Seis repositorios reales agrupados en dos programas extensos, módulos técnicos y aplicaciones culturales.</desc>
  <defs><style>
    .bg{fill:#fff7f8}.card{fill:#fff;stroke:#ead5d9;stroke-width:2}.title{font:800 34px system-ui,sans-serif;fill:#572e3b}.lead{font:500 17px system-ui,sans-serif;fill:#795c65}.kind{font:800 12px system-ui,sans-serif;letter-spacing:1.4px;fill:#97516a}.repo{font:800 18px system-ui,sans-serif;fill:#613344}.meta{font:500 14px system-ui,sans-serif;fill:#80636c}.step{fill:#f8e8ed}.steptext{font:700 13px system-ui,sans-serif;fill:#7b4055;text-anchor:middle}.rule{font:700 17px system-ui,sans-serif;fill:#fff;text-anchor:middle}.pill{fill:#e6f2ea}.pilltext{font:800 11px system-ui,sans-serif;letter-spacing:1px;fill:#235b3d}.warn{fill:#fff1d6}.warntext{font:800 11px system-ui,sans-serif;letter-spacing:1px;fill:#7a4b00}.new{fill:#ede7ff}.newtext{font:800 11px system-ui,sans-serif;letter-spacing:1px;fill:#4a2f93}
  </style></defs>
  <rect class="bg" width="1200" height="600" rx="30"/>
  <text class="title" x="60" y="70">Cuatro maneras de aprender haciendo</text>
  <text class="lead" x="60" y="106">Diseñar espacios, entender el cielo y las misiones, comprender máquinas o practicar una expresión cultural.</text>
  <g transform="translate(40 150)"><rect class="card" width="262" height="320" rx="22"/><text class="kind" x="22" y="40">PROGRAMA + TALLERES</text><rect class="pill" x="22" y="54" width="86" height="22" rx="11"/><text class="pilltext" x="35" y="69">EXISTENTE</text><text class="repo" x="22" y="108">Arquitectura y entorno</text><text class="meta" x="22" y="136">840 clases · 84 partes</text><text class="meta" x="22" y="160">60 sesiones · 35 rutas</text><rect class="step" x="22" y="196" width="218" height="96" rx="16"/><text class="steptext" x="131" y="226">necesidad → fundamento</text><text class="steptext" x="131" y="248">→ actividad → evidencia</text><text class="steptext" x="131" y="270">→ continuidad</text></g>
  <g transform="translate(326 150)"><rect class="card" width="262" height="320" rx="22"/><text class="kind" x="22" y="40">PROGRAMA + SIMULADORES</text><rect class="new" x="22" y="54" width="62" height="22" rx="11"/><text class="newtext" x="35" y="69">NUEVO</text><rect class="warn" x="92" y="54" width="104" height="22" rx="11"/><text class="warntext" x="103" y="69">TEXTO EN E0</text><text class="repo" x="22" y="108">Astronomía y espacio</text><text class="meta" x="22" y="136">2.077 clases · 12 áreas</text><text class="meta" x="22" y="160">24 rutas · 10 talleres de misión</text><rect class="step" x="22" y="196" width="218" height="96" rx="16"/><text class="steptext" x="131" y="226">observar → modelar → simular</text><text class="steptext" x="131" y="248">→ operar la misión</text><text class="steptext" x="131" y="270">revisión disciplinar pendiente</text></g>
  <g transform="translate(612 150)"><rect class="card" width="262" height="320" rx="22"/><text class="kind" x="22" y="40">MÓDULOS TÉCNICOS</text><rect class="pill" x="22" y="54" width="86" height="22" rx="11"/><text class="pilltext" x="35" y="69">EXISTENTE</text><text class="repo" x="22" y="108">Operación de maquinaria</text><text class="meta" x="22" y="136">41 módulos · 451 clases</text><text class="meta" x="22" y="160">sistemas · mandos · seguridad</text><rect class="step" x="22" y="196" width="218" height="96" rx="16"/><text class="steptext" x="131" y="232">una máquina por módulo</text><text class="steptext" x="131" y="256">teoría y simulación declaradas</text></g>
  <g transform="translate(898 150)"><rect class="card" width="262" height="320" rx="22"/><text class="kind" x="22" y="40">APLICACIONES GUIADAS</text><rect class="pill" x="22" y="54" width="86" height="22" rx="11"/><text class="pilltext" x="35" y="69">EXISTENTE</text><text class="repo" x="22" y="108">Guitarra · Violín · Cueca</text><text class="meta" x="22" y="136">24 lecciones por instrumento</text><text class="meta" x="22" y="160">24 clases y 72 actividades de cueca</text><rect class="step" x="22" y="196" width="218" height="96" rx="16"/><text class="steptext" x="131" y="232">descubrir → practicar</text><text class="steptext" x="131" y="256">→ interpretar o reflexionar</text></g>
  <rect x="125" y="510" width="950" height="45" rx="18" fill="#653447"/><text class="rule" x="600" y="538">La aplicación acompaña la práctica; el desempeño requiere evidencia propia.</text>
</svg>
