<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de arte, espacio y oficios</title>
  <desc id="desc">Cinco repositorios reales agrupados en programa extenso, módulos técnicos y aplicaciones culturales.</desc>
  <defs><style>
    .bg{fill:#fff7f8}.card{fill:#fff;stroke:#ead5d9;stroke-width:2}.title{font:800 34px system-ui,sans-serif;fill:#572e3b}.lead{font:500 17px system-ui,sans-serif;fill:#795c65}.kind{font:800 13px system-ui,sans-serif;letter-spacing:1.5px;fill:#97516a}.repo{font:800 18px system-ui,sans-serif;fill:#613344}.meta{font:500 14px system-ui,sans-serif;fill:#80636c}.step{fill:#f8e8ed}.steptext{font:700 14px system-ui,sans-serif;fill:#7b4055;text-anchor:middle}.rule{font:700 17px system-ui,sans-serif;fill:#fff;text-anchor:middle}
  </style></defs>
  <rect class="bg" width="1200" height="570" rx="30"/>
  <text class="title" x="60" y="70">Tres maneras de aprender haciendo</text>
  <text class="lead" x="60" y="106">Diseñar espacios, comprender máquinas o practicar una expresión cultural.</text>
  <g transform="translate(55 155)"><rect class="card" width="350" height="300" rx="22"/><text class="kind" x="25" y="43">PROGRAMA + TALLERES</text><text class="repo" x="25" y="84">Arquitectura y entorno</text><text class="meta" x="25" y="113">680 clases · 68 partes · 8 talleres</text><text class="meta" x="25" y="138">12 rutas de aprendizaje</text><rect class="step" x="25" y="177" width="300" height="82" rx="16"/><text class="steptext" x="175" y="206">necesidad → fundamento → actividad</text><text class="steptext" x="175" y="230">→ evidencia → continuidad</text></g>
  <g transform="translate(425 155)"><rect class="card" width="350" height="300" rx="22"/><text class="kind" x="25" y="43">MÓDULOS TÉCNICOS</text><text class="repo" x="25" y="84">Operación de maquinaria</text><text class="meta" x="25" y="113">41 módulos · 451 clases</text><text class="meta" x="25" y="138">sistemas · mandos · física · seguridad</text><rect class="step" x="25" y="177" width="300" height="82" rx="16"/><text class="steptext" x="175" y="206">una máquina por módulo</text><text class="steptext" x="175" y="230">teoría y simulación declaradas</text></g>
  <g transform="translate(795 155)"><rect class="card" width="350" height="300" rx="22"/><text class="kind" x="25" y="43">APLICACIONES GUIADAS</text><text class="repo" x="25" y="84">Guitarra · Violín · Cueca</text><text class="meta" x="25" y="113">24 lecciones por instrumento</text><text class="meta" x="25" y="138">24 clases y 72 actividades de cueca</text><rect class="step" x="25" y="177" width="300" height="82" rx="16"/><text class="steptext" x="175" y="206">descubrir → practicar</text><text class="steptext" x="175" y="230">→ interpretar o reflexionar</text></g>
  <rect x="125" y="495" width="950" height="45" rx="18" fill="#653447"/><text class="rule" x="600" y="523">La aplicación acompaña la práctica; el desempeño requiere evidencia propia.</text>
</svg>
