<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de recorridos de software y computación</title>
  <desc id="desc">Seis repositorios reales agrupados en formación integral, especialización técnica y diagnóstico por casos.</desc>
  <defs><style>
    .bg{fill:#f5faf8}.card{fill:#fff;stroke:#cbded5;stroke-width:2}.tag{fill:#dff3e8}.tagtext{font:700 12px system-ui,sans-serif;fill:#246447;letter-spacing:1px}.title{font:800 34px system-ui,sans-serif;fill:#173d30}.lead{font:500 17px system-ui,sans-serif;fill:#526b61}.h{font:800 18px system-ui,sans-serif;fill:#173d30}.repo{font:700 16px system-ui,sans-serif;fill:#24523f}.meta{font:500 14px system-ui,sans-serif;fill:#61766d}.rule{font:700 18px system-ui,sans-serif;fill:#fff;text-anchor:middle}
  </style></defs>
  <rect class="bg" width="1200" height="560" rx="30"/>
  <text class="tagtext" x="60" y="58">SOFTWARE · COMPUTACIÓN</text>
  <text class="title" x="60" y="103">Seis entradas; ninguna carrera transversal implícita</text>
  <text class="lead" x="60" y="138">Cada bloque conserva el flujo que publica su repositorio.</text>
  <g transform="translate(55 178)"><rect class="card" width="350" height="270" rx="22"/><rect class="tag" x="24" y="22" width="155" height="29" rx="14"/><text class="tagtext" x="41" y="42">PROGRAMA INTEGRAL</text><text class="repo" x="24" y="92">Modern software engineering</text><text class="meta" x="24" y="117">480 clases · 40 partes · 8 etapas</text><line x1="24" y1="143" x2="326" y2="143" stroke="#e2ede8"/><text class="repo" x="24" y="177">Modern game development</text><text class="meta" x="24" y="202">352 clases · 22 partes · rutas y labs</text><text class="h" x="24" y="244">Resultado: recorrido estructurado</text></g>
  <g transform="translate(425 178)"><rect class="card" width="350" height="270" rx="22"/><rect class="tag" x="24" y="22" width="169" height="29" rx="14"/><text class="tagtext" x="41" y="42">COMPARAR Y ELEGIR</text><text class="repo" x="24" y="92">Polyglot programming</text><text class="meta" x="24" y="117">176 clases · 12 partes · rutas</text><text class="repo" x="24" y="158">Framework ecosystems</text><text class="meta" x="24" y="183">70 de 149 clases construidas</text><text class="repo" x="24" y="224">Database systems</text><text class="meta" x="24" y="249">base común · 7 rutas por rol</text></g>
  <g transform="translate(795 178)"><rect class="card" width="350" height="270" rx="22"/><rect class="tag" x="24" y="22" width="150" height="29" rx="14"/><text class="tagtext" x="41" y="42">CASOS DE SISTEMAS</text><text class="repo" x="24" y="92">Problem-driven systems lab</text><text class="meta" x="24" y="117">20 casos Docker-first independientes</text><text class="h" x="24" y="166">Reproducir</text><text class="meta" x="24" y="190">→ diagnosticar → resolver → evidenciar</text><text class="h" x="24" y="235">Resultado: decisión técnica explicada</text></g>
  <rect x="170" y="485" width="860" height="48" rx="18" fill="#174b38"/><text class="rule" x="600" y="516">Los vínculos temáticos orientan; las unidades concretas prueban continuidad.</text>
</svg>
