<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Mapa global de roles por área y función</title>
  <desc id="desc">Ocho familias de roles descritas por los programas: educación, ingeniería, datos, seguridad, dirección, comercial, entorno construido y espacio.</desc>
  <defs><style>
    .bg{fill:#f6f8fb}.card{fill:#fff;stroke:#d5dde8;stroke-width:2}.title{font:800 34px system-ui,sans-serif;fill:#1b2b3f}.lead{font:500 17px system-ui,sans-serif;fill:#52627a}.tag{font:800 12px system-ui,sans-serif;letter-spacing:1.3px}.repo{font:800 19px system-ui,sans-serif;fill:#1b2b3f}.meta{font:500 14px system-ui,sans-serif;fill:#52627a}.rule{font:700 16px system-ui,sans-serif;fill:#fff;text-anchor:middle}
  </style></defs>
  <rect class="bg" width="1200" height="640" rx="30"/>
  <text class="title" x="60" y="68">Roles y cargos descritos por los programas</text>
  <text class="lead" x="60" y="104">Ocho familias del maestro; cada rol conserva su guía, su misión y sus límites en el repositorio fuente.</text>
  <g transform="translate(40 150)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#b45309"/><rect x="18" y="30" width="103" height="26" rx="13" fill="#fff4e5"/><text class="tag" x="29" y="48" fill="#b45309">EDUCACIÓN</text><text class="repo" x="18" y="92">Formación y evaluación</text><text class="meta" x="18" y="124">14 rutas · PRG-PEDAGOGY</text><text class="meta" x="18" y="150">docentes · UTP · evaluación</text></g>
  <g transform="translate(325 150)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#0f6a5a"/><rect x="18" y="30" width="112" height="26" rx="13" fill="#e5f6f1"/><text class="tag" x="29" y="48" fill="#0f6a5a">INGENIERÍA</text><text class="repo" x="18" y="92">Producto digital</text><text class="meta" x="18" y="124">47 roles · PRG-SOFTWARE</text><text class="meta" x="18" y="150">backend · cloud · plataforma</text></g>
  <g transform="translate(610 150)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#2563a8"/><rect x="18" y="30" width="112" height="26" rx="13" fill="#e8f0fb"/><text class="tag" x="29" y="48" fill="#2563a8">DATOS E IA</text><text class="repo" x="18" y="92">Datos y computación</text><text class="meta" x="18" y="124">7 rutas + roles de IA</text><text class="meta" x="18" y="150">datos · MLOps · gobierno de IA</text></g>
  <g transform="translate(895 150)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#9b2c3f"/><rect x="18" y="30" width="103" height="26" rx="13" fill="#fdeaee"/><text class="tag" x="29" y="48" fill="#9b2c3f">SEGURIDAD</text><text class="repo" x="18" y="92">Riesgo y cumplimiento</text><text class="meta" x="18" y="124">33 guías · PRG-CYBER</text><text class="meta" x="18" y="150">SOC · AppSec · GRC · CISO</text></g>
  <g transform="translate(40 365)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#5b3a9a"/><rect x="18" y="30" width="103" height="26" rx="13" fill="#f0eafb"/><text class="tag" x="29" y="48" fill="#5b3a9a">DIRECCIÓN</text><text class="repo" x="18" y="92">Gestión transversal</text><text class="meta" x="18" y="124">CTO · CISO · CMO · CRO</text><text class="meta" x="18" y="150">UTP · mandante · progresión</text></g>
  <g transform="translate(325 365)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#a1561f"/><rect x="18" y="30" width="103" height="26" rx="13" fill="#fdf0e4"/><text class="tag" x="29" y="48" fill="#a1561f">COMERCIAL</text><text class="repo" x="18" y="92">Crecimiento e ingresos</text><text class="meta" x="18" y="124">17 roles · PRG-MARKETING</text><text class="meta" x="18" y="150">SDR · growth · RevOps · CRO</text></g>
  <g transform="translate(610 365)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#4d6b1f"/><rect x="18" y="30" width="85" height="26" rx="13" fill="#eef5e3"/><text class="tag" x="29" y="48" fill="#4d6b1f">ENTORNO</text><text class="repo" x="18" y="92">Construido y oficios</text><text class="meta" x="18" y="124">35 rutas · PRG-ARCH</text><text class="meta" x="18" y="150">proyecto · obra · tipologías</text></g>
  <g transform="translate(895 365)"><rect class="card" width="265" height="195" rx="20"/><rect x="0" y="0" width="265" height="10" rx="5" fill="#1f4f7a"/><rect x="18" y="30" width="85" height="26" rx="13" fill="#e3eef8"/><text class="tag" x="29" y="48" fill="#1f4f7a">ESPACIO</text><text class="repo" x="18" y="92">Ciencia y misión</text><text class="meta" x="18" y="124">24 roles · PRG-ASTRO</text><text class="meta" x="18" y="150">astrofísica · satélites · derecho</text></g>
  <rect x="40" y="585" width="1120" height="40" rx="16" fill="#1b2b3f"/><text class="rule" x="600" y="611">Un rol no es un curso ni una habilitación: las rutas reordenan clases y la evidencia propia decide.</text>
</svg>
