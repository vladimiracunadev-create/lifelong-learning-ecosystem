<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Tipos de flujo que existen en los repositorios</title>
  <desc id="desc">Seis formas reales de recorrer contenidos: secuencia, rutas, niveles, módulos, casos y academia en aplicación.</desc>
  <defs><style>
    .bg{fill:#f8fbf9}.card{fill:white;stroke:#cbdad3;stroke-width:2}.n{fill:#1f6b49}.ntext{font:700 18px system-ui,sans-serif;fill:white;text-anchor:middle}.h{font:700 21px system-ui,sans-serif;fill:#17392d}.p{font:500 15px system-ui,sans-serif;fill:#4b6258}.arrow{stroke:#78a18e;stroke-width:3;fill:none;marker-end:url(#head)}
  </style><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#78a18e"/></marker></defs>
  <rect class="bg" width="1200" height="540" rx="28"/>
  <path class="arrow" d="M196 145h68"/><path class="arrow" d="M396 145h68"/><path class="arrow" d="M596 145h68"/><path class="arrow" d="M796 145h68"/><path class="arrow" d="M996 145h68"/>
  <g transform="translate(22 72)"><rect class="card" width="174" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">1</text><text class="h" x="22" y="83">Secuencia</text><text class="p" x="22" y="110">partes y clases</text><text class="p" x="22" y="132">en orden declarado</text></g>
  <g transform="translate(222 72)"><rect class="card" width="174" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">2</text><text class="h" x="22" y="83">Ruta</text><text class="p" x="22" y="110">por rol, perfil</text><text class="p" x="22" y="132">u objetivo</text></g>
  <g transform="translate(422 72)"><rect class="card" width="174" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">3</text><text class="h" x="22" y="83">Nivel</text><text class="p" x="22" y="110">escolar, mundo</text><text class="p" x="22" y="132">o habilidad</text></g>
  <g transform="translate(622 72)"><rect class="card" width="174" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">4</text><text class="h" x="22" y="83">Módulo</text><text class="p" x="22" y="110">especialización</text><text class="p" x="22" y="132">con prerrequisitos</text></g>
  <g transform="translate(822 72)"><rect class="card" width="174" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">5</text><text class="h" x="22" y="83">Caso o lab</text><text class="p" x="22" y="110">problema real</text><text class="p" x="22" y="132">y evidencia</text></g>
  <g transform="translate(1022 72)"><rect class="card" width="156" height="146" rx="18"/><circle class="n" cx="34" cy="34" r="21"/><text class="ntext" x="34" y="41">6</text><text class="h" x="22" y="83">App</text><text class="p" x="22" y="110">academia local</text><text class="p" x="22" y="132">y progreso</text></g>
  <g transform="translate(125 310)"><rect x="0" y="0" width="950" height="150" rx="24" fill="#17392d"/><text x="475" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#a9d4bf">REGLA DEL REPOSITORIO MAESTRO</text><text x="475" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="white">Conservar el flujo que la fuente declara</text><text x="475" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#dceee4">Un vínculo temático no se convierte en prerrequisito ni en malla sin evidencia.</text></g>
</svg>
