name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6bc82e05fd0ea64601dd4b465378bbcf57de0314c # v4.32.1
        with:
          languages: ${{ matrix.language }}

      - name: Analizar
        uses: github/codeql-action/analyze@6bc82e05fd0ea64601dd4b465378bbcf57de0314c # v4.32.1
        with:
          category: /language:${{ matrix.language }}
